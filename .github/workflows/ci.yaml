name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: ros_ws/src/arena_swerve_controller

      - name: install dependencies
        working-directory: ros_ws
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy

      - name: build
        working-directory: ros_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --merge-install --packages-select arena_swerve_controller

      - name: test
        working-directory: ros_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --merge-install --packages-select arena_swerve_controller --return-code-on-test-failure
          colcon test-result --verbose

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: colcon-logs
          path: ros_ws/log
